name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mhx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'MoaidHathot/MHX' &&
      github.repository_id == '1442729283' &&
      github.repository_owner_id == '8770486' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check stable version/tag agreement
        shell: pwsh
        run: ./scripts/Assert-ReleaseContext.ps1
  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    if: >-
      github.repository == 'MoaidHathot/MHX' &&
      github.repository_id == '1442729283' &&
      github.repository_owner_id == '8770486' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: mhx-*
          path: artifacts/downloaded
      - name: Assemble verified assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Assemble-Release.ps1 -InputDirectory artifacts/downloaded -Tag $env:RELEASE_TAG
      - name: Upload draft and publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Host 'Release already published; preserving existing assets.'
              exit 0
            }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "MHX $env:RELEASE_TAG" --notes-file artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = @(Get-ChildItem artifacts/release-final -File | Select-Object -ExpandProperty FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; draft retained.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
  nuget:
    needs: publish
    if: >-
      github.repository == 'MoaidHathot/MHX' &&
      github.repository_id == '1442729283' &&
      github.repository_owner_id == '8770486' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') &&
      vars.NUGET_USER != ''
    environment: nuget-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '11.0.x'
      - name: Download canonical release package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $name = "MHX.$($env:RELEASE_TAG.Substring(1)).nupkg"
          gh release download $env:RELEASE_TAG --pattern $name --pattern mhx-release.json --dir package
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download canonical package.' }
          $manifest = Get-Content package/mhx-release.json -Raw | ConvertFrom-Json
          $entries = @($manifest.files | Where-Object { $_.name -ceq $name -and $_.kind -ceq 'dotnet-tool' })
          if ($manifest.schemaVersion -ne 1 -or "v$($manifest.version)" -cne $env:RELEASE_TAG -or $entries.Count -ne 1 -or
              (Get-FileHash "package/$name" -Algorithm SHA256).Hash -ine $entries[0].sha256 -or
              (Get-Item "package/$name").Length -ne $entries[0].size) { throw 'Canonical package identity, checksum, or size mismatch.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "package/$name").Path)
          try {
            $nuspecs = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
            if ($nuspecs.Count -ne 1 -or $nuspecs[0].Length -gt 1048576) { throw 'Unexpected package metadata layout.' }
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $stream = $nuspecs[0].Open()
            $reader = [Xml.XmlReader]::Create($stream, $settings)
            try {
              $document = [Xml.XmlDocument]::new()
              $document.XmlResolver = $null
              $document.Load($reader)
              $id = $document.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='id']").InnerText
              $version = $document.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='version']").InnerText
              if ($id -cne 'MHX' -or "v$version" -cne $env:RELEASE_TAG) { throw 'Package ID/version does not match the authorized release.' }
            } finally { $reader.Dispose(); $stream.Dispose() }
          } finally { $archive.Dispose() }
      - name: Obtain short-lived NuGet credential
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish NuGet package
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet nuget push package/*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
